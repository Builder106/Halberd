<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4a5a6e"/>
      <stop offset="50%" stop-color="#5e6e80"/>
      <stop offset="100%" stop-color="#384452"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1a2230" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a2230" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Halberd mark, centered around x=220 -->
  <g transform="translate(220 210)">
    <rect x="-6" y="-160" width="12" height="320" fill="#384452" rx="2"/>
    <rect x="-6" y="-160" width="6"  height="320" fill="#1a2230" rx="2"/>

    <polygon points="0,-200 -10,-160 10,-160" fill="url(#steel)" stroke="#1a2230" stroke-width="1"/>

    <path d="M -10 -140
             Q -75 -120 -95 -70
             Q -85 -55 -60 -50
             L -10 -55
             Z"
          fill="url(#steel)" stroke="#1a2230" stroke-width="1.5"/>
    <path d="M -95 -70 Q -85 -55 -60 -50" fill="none" stroke="url(#edge)" stroke-width="2"/>

    <path d="M 10 -140
             Q 50 -120 65 -90
             Q 55 -75 35 -75
             L 10 -90
             Z"
          fill="url(#steel)" stroke="#1a2230" stroke-width="1.5"/>

    <rect x="-22" y="-50" width="44" height="14" rx="3" fill="#5e6e80" stroke="#1a2230" stroke-width="1"/>
    <rect x="-22" y="-50" width="44" height="3"  fill="#dde6f0" opacity="0.9"/>

    <circle cx="0" cy="155" r="10" fill="#5e6e80" stroke="#1a2230" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(430 210)">
    <text x="0" y="-30"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-size="96"
          font-weight="800"
          letter-spacing="-2"
          fill="#0d1322">HALBERD</text>

    <text x="0" y="96"
          font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
          font-size="18"
          fill="#6e7e92">tools/call → policy → audit → upstream</text>
  </g>
</svg>
